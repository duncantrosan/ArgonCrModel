# 80 W N2 admixture sweeps (0-10 % N2) at 0.6, 1 and 1.5 Torr (echelle data added 2026-10-11), Ne free.
#   python Main.py input_N2sweep_80W.toml --plan   then without --plan

[run]
output_folder = "Experimental_Data/Output/N2Sweep3Powers3Pressures"

[fit]
Ne_pin = "free_else_nc"        # free Ne, n_c where the free fit runs to the grid edge

[las]
file = "Experimental_Data/LAS_Data/Master_AllMeasurements.csv"
frequency_MHz = [2400, 2450]   # only LAS rows in this source-frequency range are used
match_power_W = 5              # an LAS row matches an OES condition at the same p and % N2, power within ±5 W
write_summary = true
summary_base = ""          # table to add OES columns to; "" = the `file` above
summary_file = ""          # where to write; "" = default path below
summary_in_place = false   # true = write the OES columns back into summary_base itself


[[dataset]]
name = "80W_0.6Torr_0-10pctN2"
folder = "N2AdmixtureSweep0,6Torr80W"
files = "N2_Percent_{x}_{rep}"
sweep = "N2"
power_W = 80
pressure_mTorr = 600

[[dataset]]
name = "80W_1Torr_0-10pctN2"
folder = "N2AdmixtureSweep1Torr80W"
files = "N2_Percent_{x}_{rep}"
sweep = "N2"
power_W = 80
pressure_mTorr = 1000

[[dataset]]
name = "80W_1.5Torr_0-10pctN2"
folder = "N2AdmixtureSweep1,5Torr80W"
files = "N2_Percent_{x}_{rep}"
sweep = "N2"
power_W = 80
pressure_mTorr = 1500
