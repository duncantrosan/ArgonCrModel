# 80 W N2 admixture sweeps (0-10 % N2) at 0.6, 1 and 1.5 Torr against the LAS runs measured with the echelle spectra
# (MiniChamberDataAnalysis Output/Batch_EchelleComparisionData, copied to Experimental_Data/LAS_Data); pure-Ar EEDF.
# One of three runs compared in SmallAnalysisScripts/MetastablesVsLAS.py (with _vibsat and _TvLAS).
#   python Main.py InputFiles/input_N2sweep_80W_EchelleLAS_pureAr.toml --plan   then without --plan

[run]
output_folder = "Experimental_Data/Output/N2Sweep80W_EchelleLAS_pureArEEDF"

[eedf]
model = "pure_Ar"

[fit]
Ne_pin = "free_else_nc"        # free Ne, n_c where the free fit runs to the grid edge

[las]
exclude_runs = ["707ea594"]    # bad first 1 Torr run, redone as bc16bda5

[[dataset]]
name = "80W_0.6Torr_0-10pctN2"
folder = "N2AdmixtureSweep0,6Torr80W"
files = "N2_Percent_{x}_{rep}"
sweep = "N2"
power_W = 80
pressure_mTorr = 600

[[dataset]]
name = "80W_1Torr_0-10pctN2"
folder = "N2AdmixtureSweep1Torr80W"
files = "N2_Percent_{x}_{rep}"
sweep = "N2"
power_W = 80
pressure_mTorr = 1000

[[dataset]]
name = "80W_1.5Torr_0-10pctN2"
folder = "N2AdmixtureSweep1,5Torr80W"
files = "N2_Percent_{x}_{rep}"
sweep = "N2"
power_W = 80
pressure_mTorr = 1500
